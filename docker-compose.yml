name: invoice-ai

x-service-common: &service-common
  restart: unless-stopped
  networks:
    - invoice-network
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

x-service-env: &service-env
  NODE_ENV: production
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: ${DB_USER:-invoiceadmin}
  DB_PASSWORD: ${DB_PASSWORD:-invoice@Pass123}
  DB_NAME: ${DB_NAME:-invoicedb}
  JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-in-prod}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-node-healthcheck: &node-healthcheck
  interval: 30s
  timeout: 5s
  retries: 5
  start_period: 20s

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-invoiceadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-invoice@Pass123}
      POSTGRES_DB: ${DB_NAME:-invoicedb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - invoice-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - invoice-network

  auth-service:
    <<: *service-common
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    environment:
      <<: *service-env
      PORT: 3001
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super-secret-refresh-key}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    expose:
      - "3001"
    volumes:
      - app_logs:/app/logs
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]

  invoice-service:
    <<: *service-common
    build:
      context: ./services/invoice-service
      dockerfile: Dockerfile
    environment:
      <<: *service-env
      PORT: 3002
      UPLOAD_DIR: /app/uploads
      OCR_SERVICE_URL: http://ocr-service:3003
      DUPLICATE_SERVICE_URL: http://duplicate-detection-service:3004
      FRAUD_SERVICE_URL: http://fraud-detection-service:3005
      APPROVAL_SERVICE_URL: http://approval-service:3006
      NOTIFICATION_SERVICE_URL: http://notification-service:3008
    expose:
      - "3002"
    volumes:
      - uploads_data:/app/uploads
      - app_logs:/app/logs
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3002/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]

  ocr-service:
    <<: *service-common
    build:
      context: ./services/ocr-service
      dockerfile: Dockerfile
    environment:
      <<: *service-env
      PORT: 3003
      UPLOAD_DIR: /app/uploads
      OCR_ENGINE: ${OCR_ENGINE:-simulation}
      OCR_LANGUAGE: ${OCR_LANGUAGE:-eng}
      OCR_FALLBACK_TO_SIMULATION: ${OCR_FALLBACK_TO_SIMULATION:-true}
    expose:
      - "3003"
    volumes:
      - uploads_data:/app/uploads
      - app_logs:/app/logs
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3003/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]

  duplicate-detection-service:
    <<: *service-common
    build:
      context: ./services/duplicate-detection-service
      dockerfile: Dockerfile
    environment:
      <<: *service-env
      PORT: 3004
      NOTIFICATION_SERVICE_URL: http://notification-service:3008
    expose:
      - "3004"
    volumes:
      - app_logs:/app/logs
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3004/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]

  fraud-detection-service:
    <<: *service-common
    build:
      context: ./services/fraud-detection-service
      dockerfile: Dockerfile
    environment:
      <<: *service-env
      PORT: 3005
      NOTIFICATION_SERVICE_URL: http://notification-service:3008
      GEMINI_ENABLED: ${GEMINI_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
    expose:
      - "3005"
    volumes:
      - app_logs:/app/logs
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3005/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]

  approval-service:
    <<: *service-common
    build:
      context: ./services/approval-service
      dockerfile: Dockerfile
    environment:
      <<: *service-env
      PORT: 3006
      NOTIFICATION_SERVICE_URL: http://notification-service:3008
      INVOICE_SERVICE_URL: http://invoice-service:3002
    expose:
      - "3006"
    volumes:
      - app_logs:/app/logs
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3006/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]

  vendor-service:
    <<: *service-common
    build:
      context: ./services/vendor-service
      dockerfile: Dockerfile
    environment:
      <<: *service-env
      PORT: 3007
    expose:
      - "3007"
    volumes:
      - app_logs:/app/logs
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3007/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]

  notification-service:
    <<: *service-common
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    environment:
      <<: *service-env
      PORT: 3008
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-noreply@invoiceplatform.com}
      SMTP_PASS: ${SMTP_PASS:-changeme}
    expose:
      - "3008"
    volumes:
      - app_logs:/app/logs
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3008/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]

  analytics-service:
    <<: *service-common
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    environment:
      <<: *service-env
      PORT: 3009
    expose:
      - "3009"
    volumes:
      - app_logs:/app/logs
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3009/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${API_GATEWAY_PORT:-8080}:80"
    depends_on:
      auth-service:
        condition: service_healthy
      invoice-service:
        condition: service_healthy
      ocr-service:
        condition: service_healthy
      duplicate-detection-service:
        condition: service_healthy
      fraud-detection-service:
        condition: service_healthy
      approval-service:
        condition: service_healthy
      vendor-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - invoice-network

networks:
  invoice-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  app_logs:
